services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kapita-financial-db
      POSTGRES_USER: kapita-financial
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapita-financial -d kapita-financial-db"]
      interval: 5s
      timeout: 3s
      retries: 20

  kapita:
    build:
      context: .
      dockerfile: Dockerfile
    image: kapita:e2e
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: kapita-financial-db
      DB_USER: kapita-financial
      DB_PASSWORD: change-me
      ISSUER_URI: http://auth-service.local
      JWT_AUDIENCE: kapita-api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
