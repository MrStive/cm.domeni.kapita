---
spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    bus:
      enabled: false
    stream:
      enabled: false
  kafka:
    bootstrap-servers: "localhost:9092"
    listener:
      auto-startup: false
eureka:
  client:
    enabled: false
kapita:
  subscription:
    scheduler:
      enabled: false
      cron: "0 0 * * * *"
  security:
    expose-docs: true
    jwt:
      issuer: "http://auth-service.local"
      audience: "kapita-api"
      public-key-location: "classpath:security/jwt-public.pem"
